server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # User Service
    location /api/users/ {
        proxy_pass http://user-service:3001;
    }

    # Search Service
    location /api/search/ {
        proxy_pass http://search-service:3002;
    }

    # Block public access to an internal booking endpoint
    location ~ ^/api/bookings/[^/]+/status$ {
        return 403;
    }

    # Booking Service
    location /api/bookings/ {
        proxy_pass http://booking-service:3003;
    }

    # Payment Service
    location /api/payments/ {
        proxy_pass http://payment-service:3004;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
